name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Signing key (real key if the secret is set, otherwise a test key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias designstager -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass dstest123 -keypass dstest123 -dname "CN=DesignStager Test, O=DesignStager, C=IN"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dstest123' }}
          KEY_ALIAS: designstager
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dstest123' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.apk" -exec cp {} out/ \;
          find android/app/build/outputs -name "*.aab" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: designstager-android-${{ github.run_number }}
          path: out/

      - name: Publish as a GitHub release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          for f in *.apk; do mv "$f" "DesignStager-1.0.${{ github.run_number }}-${f}"; done
          gh release create "build-${{ github.run_number }}" * \
            --title "DesignStager Android build ${{ github.run_number }}" \
            --notes "Install the .apk on your phone to test. The .aab (when present) is for the Play Store." \
            --repo "${{ github.repository }}"

      - name: Keep the latest files on the 'builds' branch
        run: |
          git config user.name "DesignStager build"
          git config user.email "noreply@designstager.com"
          git checkout --orphan builds
          git rm -rf --cached . > /dev/null
          git add -f out/*
          git commit -m "Build ${{ github.run_number }}"
          git push -f origin builds
